<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Contact Form</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
    @font-face {
        font-family: Georgia;
        src: url("Georgia.ttf");
    } body {
        background: whitesmoke;
    } #page {
        width: 928px;
        height: 1224px;
        background: white;
        margin: 0 auto;
        padding: 48px;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } h1 {
        font: 48pt/1.0em 'Dancing Script', cursive;
        text-align: center;
        text-shadow: 2px 3px 6px darkorange;
    } h2 {
        font: italic 14pt/2.4em Georgia, serif;
        text-align: center;
    } form {
        margin: 0 auto;
        background: lightyellow;
        border: 1px solid dimgray;
        border-radius: 6px;
        box-shadow: 2px 3px 6px darkgray;
    }
</style>
</head>

<body>
<div id="page">
<h1>Contact Form</h1>

<form action="/action_page.php">
  <fieldset>
    <legend>Contact Information</legend>
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" value="John"><br>
    
    <label for="email">Email:</label><br>
    <input type="text" id="email" name="email" value="Doe"><br>
    
    <label for="subject">Subject:</label><br>
    <input type="text" id="subject" name="subject"><br>
    
    <label for="comments">Comments:</label><br>
    <textarea id="comments" name="comments"></textarea><br><br>
  </fieldset>

  <fieldset>
    <legend>Select Option</legend>
    <input type="radio" id="radio1" name="radio">
    <label for="radio1">Option 1</label><br>
    
    <input type="radio" id="radio2" name="radio">
    <label for="radio2">Option 2</label><br>
    
    <input type="radio" id="radio3" name="radio">
    <label for="radio3">Option 3</label><br><br>
  </fieldset>

  <input type="submit" value="Submit">
</form>
</div>
</body>
</html>
