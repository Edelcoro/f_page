<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Contact Form</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
    @font-face {
        font-family: Georgia;
        src: url("Georgia.ttf");
    } body {
        background: whitesmoke;
    } #page {
        width: 928px;
        height: 1224px;
        background: white;
        margin: 0 auto;
        padding: 48px;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } h1 {
        font: 48pt/1.0em 'Dancing Script', cursive;
        text-align: center;
        text-shadow: 2px 3px 6px darkorange;
    } h2 {
        font: italic 14pt/2.4em Georgia, serif;
        text-align: center;
    } form {
        margin: 0 auto;
        background: lightyellow;
        border: 1px solid dimgray;
        border-radius: 6px;
        box-shadow: 2px 3px 6px darkgray;
    }
</style>
</head>

<body>
<div id="page">
<h1>Contact Us</h1>
<h2>Created with <a href="https://chatai.com">ChatAI</a> and Canva</h2>

<form>
    <fieldset>
        <legend>Contact Information</legend>
        <label for="name">Name</label>
        <input type="text" id="name">
        
        <label for="email">Email</label>
        <input type="text" id="email">
        
        <label for="subject">Subject</label>
        <input type="text" id="subject">
        
        <label for="comments">Comments</label>
        <textarea id="comments"></textarea>
    </fieldset>

    <fieldset>
        <legend>Select Option</legend>
        <input type="radio" id="radio1" name="radio">
        <label for="radio1">Option 1</label>
        
        <input type="radio" id="radio2" name="radio">
        <label for="radio2">Option 2</label>
        
        <input type="radio" id="radio3" name="radio">
        <label for="radio3">Option 3</label>
    </fieldset>

    <input type="submit" value="Send Message">
</form>
</div>
</body>
</html>
